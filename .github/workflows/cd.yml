name: Entrega Contínua

on:
  push:
    tags:
      - 'rc-*'

jobs:
  entrega:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar compilação
        run: python -m compileall -q backend frontend tests main.py

      - name: Análise estática de qualidade
        run: |
          pip install pylint
          pylint backend frontend tests main.py --exit-zero

      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v

      - name: Gerar pacote ZIP
        run: |
          zip -r projeto-${GITHUB_REF_NAME}.zip backend frontend tests .github main.py requirements.txt README.md -x "*/__pycache__/*" "*.pyc"

      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v4
        with:
          name: projeto-${{ github.ref_name }}
          path: projeto-${{ github.ref_name }}.zip
